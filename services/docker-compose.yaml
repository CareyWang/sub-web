version: "3"
services:
  subweb:
    build: ../.
    container_name: subweb
    restart: always
    ports: 
      - "${SUBWEB_PORT}:80"
    environment:
      VITE_SUBCONVERTER_DEFAULT_BACKEND: ${VITE_SUBCONVERTER_DEFAULT_BACKEND:-}
      VITE_MYURLS_API: ${VITE_MYURLS_API:-}
      VITE_CONFIG_UPLOAD_API: ${VITE_CONFIG_UPLOAD_API:-}
      VITE_PROJECT: ${VITE_PROJECT:-}
      VITE_BOT_LINK: ${VITE_BOT_LINK:-}
      VITE_BACKEND_RELEASE: ${VITE_BACKEND_RELEASE:-}
      VITE_SUBCONVERTER_REMOTE_CONFIG: ${VITE_SUBCONVERTER_REMOTE_CONFIG:-}
      VITE_SUBCONVERTER_DOC_ADVANCED: ${VITE_SUBCONVERTER_DOC_ADVANCED:-}
      VITE_USE_STORAGE: ${VITE_USE_STORAGE:-}
      VITE_CACHE_TTL: ${VITE_CACHE_TTL:-}

  myurls:
    image: "careywong/myurls:latest"
    container_name: myurls
    restart: always
    ports:
      - "${MYURLS_PORT}:8002"
    volumes:
      - ./data/myurls/logs:/app/logs       
    depends_on:
      - myurls-redis
    entrypoint: ["/app/myurls", "-domain", "${MYURLS_DOMAIN}", "-conn", myurls-redis:6379, "-ttl", "${MYURLS_TTL}"]
  
  myurls-redis:
    image: "redis:5"
    container_name: myurls-redis
    restart: always
    volumes:
      - ./data/redis:/data    
    expose:
      - "6379"
